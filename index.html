<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#13202a">
<link rel="icon" href="logo.png">
<link rel="apple-touch-icon" href="logo.png">
<title>설비 QR 점검</title>
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;padding:0}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<script src="config.js"></script>
<script src="lib/qrcode.min.js"></script>
<script src="lib/jsQR.js"></script>
<script src="api.js"></script>
<style>
/* Layout: 현장 계기판 — 상단 고정 바(구분 전환·QR 스캔), 본문은 '상태 먼저' 목록, 손가락 터치 52px 이상. 설비코드는 노란 명판 태그. */
:root{
  --bg:#eef1f3; --surface:#ffffff; --sunk:#f5f7f8; --ink:#13202a; --muted:#5a6a76; --faint:#8995a0; --line:#dbe1e5;
  --accent:#0b5872; --accent-ink:#ffffff; --accent-soft:#e3eff3;
  --tag:#f4c20d; --tag-ink:#1b1500;
  --ok:#1b7a43; --ok-bg:#e2f3e8; --todo:#b25e00; --todo-bg:#fdf0dc; --ng:#c42b2b; --ng-bg:#fde6e3;
  --bar-bg:#13202a; --bar-ink:#eef3f6; --bar-muted:#9fb0bc; --bar-line:#2a3a46;
  --shadow:0 1px 2px rgba(19,32,42,.06),0 2px 8px rgba(19,32,42,.05);
  --f-body:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:12px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f161b; --surface:#172129; --sunk:#121b21; --ink:#e6ecf0; --muted:#9aa9b4; --faint:#71808b; --line:#26343e;
  --accent:#5bb8d8; --accent-ink:#04222c; --accent-soft:#16303a;
  --tag:#e9b70a; --tag-ink:#1b1500;
  --ok:#62cf8f; --ok-bg:#153022; --todo:#f0b04a; --todo-bg:#33260f; --ng:#ff7f78; --ng-bg:#3b1a18;
  --bar-bg:#0a1014; --bar-ink:#e6ecf0; --bar-muted:#8b9ba6; --bar-line:#22303a;
  --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f161b; --surface:#172129; --sunk:#121b21; --ink:#e6ecf0; --muted:#9aa9b4; --faint:#71808b; --line:#26343e;
  --accent:#5bb8d8; --accent-ink:#04222c; --accent-soft:#16303a;
  --tag:#e9b70a; --tag-ink:#1b1500;
  --ok:#62cf8f; --ok-bg:#153022; --todo:#f0b04a; --todo-bg:#33260f; --ng:#ff7f78; --ng-bg:#3b1a18;
  --bar-bg:#0a1014; --bar-ink:#e6ecf0; --bar-muted:#8b9ba6; --bar-line:#22303a;
  --shadow:none; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bar-bg)}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.25}
h1{font-size:24px;font-weight:700}
h2{font-size:18px;font-weight:700}
a{color:var(--accent)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sp{justify-content:space-between}

/* ---------- 상단 고정 바 ---------- */
.appbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:12;background:var(--bar-bg);color:var(--bar-ink);border-bottom:1px solid var(--bar-line)}
.appbar-in{max-width:1180px;margin:0 auto;padding-block:10px;row-gap:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--bar-ink);font-weight:700;font-size:17px;white-space:nowrap}
.brand i{width:26px;height:26px;border-radius:6px;background:var(--tag);display:grid;place-items:center;color:var(--tag-ink);font-style:normal;font-size:14px;font-weight:800}
.crumbs{display:flex;align-items:center;gap:6px;min-width:0;flex:1 1 0;font-size:14px;color:var(--bar-muted);overflow:hidden}
.crumbs a{color:var(--bar-ink);text-decoration:none;font-weight:600;white-space:nowrap}
.crumbs span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumbs .sep{opacity:.5}
.barctl{display:flex;align-items:center;gap:8px;margin-left:auto}
.homebtn{display:inline-flex;align-items:center;gap:6px;background:var(--bar-line);color:var(--bar-ink);text-decoration:none;font-weight:700;font-size:15px;border-radius:10px;padding:8px 14px;min-height:44px;white-space:nowrap}
.homebtn svg{width:20px;height:20px}
.homebtn[aria-current="page"]{background:var(--bar-ink);color:var(--bar-bg)}
.sesbox{display:flex;align-items:center;gap:8px}
.ses{display:flex;align-items:center;gap:8px;color:var(--bar-ink);font-size:14px;white-space:nowrap}
.ses i{width:10px;height:10px;border-radius:50%;background:#3ddc84;box-shadow:0 0 0 3px rgba(61,220,132,.25)}
.sesend{border:1px solid var(--bar-line);background:transparent;color:var(--bar-ink);border-radius:10px;padding:8px 12px;font-weight:700;font-size:14px;min-height:42px}
.sesstart{background:var(--bar-ink);color:var(--bar-bg);text-decoration:none;font-weight:700;border-radius:10px;padding:10px 16px;font-size:15px;min-height:44px;display:inline-flex;align-items:center}
.startbox{max-width:640px;gap:16px}
.stepl{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px}
.stepn{width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:14px}
.bigin{border:2px solid var(--line);border-radius:12px;padding:14px 16px;font-size:20px;background:var(--surface);color:var(--ink);min-height:58px}
.bigin:focus{border-color:var(--accent);outline:none}
.rolepick{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.rp{border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:4px;align-items:flex-start;min-height:96px;color:var(--ink)}
.rp b{font-size:22px}
.rp small{font-size:14px;color:var(--muted)}
.rp.on{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
@media (max-width:900px){.ses span{display:none}}
@media (max-width:640px){.crumbs{flex-basis:100%}}
.roleseg{display:flex;background:var(--bar-line);border-radius:10px;padding:3px}
.roleseg button{border:0;background:transparent;color:var(--bar-muted);font-weight:700;font-size:15px;padding:8px 16px;border-radius:8px;min-height:40px}
.roleseg button[aria-pressed="true"]{background:var(--bar-ink);color:var(--bar-bg)}
.scanbtn{display:inline-flex;align-items:center;gap:8px;background:var(--tag);color:var(--tag-ink);font-weight:700;font-size:15px;border-radius:10px;padding:8px 16px;min-height:46px;cursor:pointer;white-space:nowrap}
.scanbtn svg{width:20px;height:20px}
a.scanbtn{text-decoration:none}

/* ---------- 본문 ---------- */
.wrap{max-width:1180px;margin:0 auto;padding-block:20px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0;box-shadow:var(--shadow)}
.panel.flat{box-shadow:none}
.sechead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.sechead .sub{font-size:14px;color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 16px;font-weight:600;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
a.btn.primary{color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn.sm{min-height:36px;padding:6px 12px;font-size:14px}
.btn.big{min-height:56px;font-size:18px;padding:12px 22px;font-weight:700}
.btn:disabled{opacity:.45;cursor:default}
.btn.danger{color:var(--ng)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:700;padding:3px 10px;border-radius:999px;white-space:nowrap;background:var(--sunk);color:var(--muted)}
.chip.ok{background:var(--ok-bg);color:var(--ok)}
.chip.ng{background:var(--ng-bg);color:var(--ng)}
.chip.todo{background:var(--todo-bg);color:var(--todo)}
.chip.pend{background:var(--sunk);color:var(--muted)}
.chip.draft{background:var(--todo-bg);color:var(--todo);font-weight:600}
.tagcode{display:inline-block;background:var(--tag);color:var(--tag-ink);font-family:var(--f-mono);font-weight:600;font-size:13px;letter-spacing:.05em;padding:2px 8px;border-radius:4px;white-space:nowrap}
.empty{padding:28px 12px;text-align:center;color:var(--muted)}
.prog{height:8px;border-radius:4px;background:var(--sunk);overflow:hidden;border:1px solid var(--line)}
.prog i{display:block;height:100%;background:var(--todo);border-radius:4px}
.prog.ok i{background:var(--ok)}
.prog.ng i{background:var(--ng)}

/* ---------- 메인 ---------- */
.hello{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.hello h1{font-size:26px}
.hello .date{color:var(--muted);font-size:15px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.stat{padding:16px 18px;display:flex;flex-direction:column;gap:4px;min-width:0;border-left:1px solid var(--line)}
.stat:first-child{border-left:0}
.stat .k{font-size:14px;font-weight:600;color:var(--muted)}
.stat .v{font-family:var(--f-mono);font-size:34px;font-weight:600;line-height:1.05;font-variant-numeric:tabular-nums}
.stat .v small{font-size:18px;color:var(--faint);font-weight:500}
.stat .d{font-size:13px;color:var(--muted)}
.stat.todo .v{color:var(--todo)} .stat.ok .v{color:var(--ok)} .stat.alert .v{color:var(--ng)}
.search{width:100%;border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--surface);color:var(--ink);font-size:16px;min-height:48px}
.line{display:flex;flex-direction:column;gap:10px}
.linehd{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;padding:0 2px}
.linehd h2{font-size:19px}
.linehd .cnt{font-size:14px;color:var(--muted)}
.eqgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:680px){.eqgrid{grid-template-columns:1fr}}
.eq{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 12px;align-items:center;padding:14px 16px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);text-decoration:none;color:var(--ink);box-shadow:var(--shadow);min-height:92px}
.eq:hover{border-color:var(--accent)}
.eq .nm{font-size:18px;font-weight:700;line-height:1.3;min-width:0}
.eq .cd{font-family:var(--f-mono);font-size:12px;color:var(--faint);margin-top:2px}
.eq .pr{grid-column:1/-1;display:flex;align-items:center;gap:10px}
.eq .pr .prog{flex:1}
.eq .pr .n{font-family:var(--f-mono);font-size:13px;color:var(--muted);white-space:nowrap}
.eq .flags{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap}
.unreg{display:flex;flex-direction:column;gap:10px}
.unreg summary{font-weight:700;font-size:16px;cursor:pointer;color:var(--muted);padding:4px 2px}
.unreg .list2{display:flex;flex-wrap:wrap;gap:8px}
.pill{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;text-decoration:none;color:var(--ink);font-weight:600;font-size:15px;min-height:44px}
.pill .mono{font-size:12px;color:var(--faint)}
.issuelist{display:flex;flex-direction:column}
.irow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);text-decoration:none;color:var(--ink)}
.irow:first-child{border-top:0}
.irow .t{font-weight:700}
.irow .s{font-size:14px;color:var(--muted)}

/* ---------- 첫 화면 ---------- */
body.landing .appbar{display:none}
body.landing::before{background:var(--bar-bg)}
body.landing{background:var(--bar-bg)}
body.landing .wrap{max-width:none;padding:0}
.land{min-height:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;justify-content:center;align-items:center;gap:28px;padding-block:40px 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));color:var(--bar-ink);background:radial-gradient(120% 80% at 50% 0%,#1d3a4a 0%,var(--bar-bg) 60%)}
.land-in{display:flex;flex-direction:column;align-items:center;gap:30px;text-align:center;max-width:620px;width:100%}
.land-logo{background:#fff;border-radius:20px;padding:22px 32px;box-shadow:0 12px 40px rgba(0,0,0,.35)}
.land-logo img{display:block;width:320px;max-width:100%;height:auto}
.land-k{font-size:15px;font-weight:700;letter-spacing:.12em;color:var(--tag)}
.land-t h1{font-size:38px;letter-spacing:-.02em;margin-top:6px;color:#fff}
.land-t p{margin:10px 0 0;color:var(--bar-muted);font-size:17px;line-height:1.6}
.land-t p b{color:#fff}
.land-clock{display:flex;flex-direction:column;align-items:center;gap:2px}
.land-clock b{font-size:44px;color:#fff;letter-spacing:.04em}
.land-clock span{color:var(--bar-muted);font-size:15px}
.land-go{display:flex;flex-direction:column;align-items:center;gap:14px;width:100%}
.land-btn{background:var(--tag);color:var(--tag-ink);border:0;font-size:22px;font-weight:800;min-height:68px;width:min(420px,100%);border-radius:16px;box-shadow:0 8px 24px rgba(244,194,13,.25)}
.land-sub{color:var(--bar-ink);font-weight:600;font-size:16px;text-underline-offset:4px}
.land-foot{color:var(--bar-muted);font-size:13px}
@media (max-width:520px){.land-t h1{font-size:30px}.land-logo{padding:16px 20px}}

/* ---------- 앱 메인 ---------- */
.hero{display:flex;align-items:center;gap:24px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px 24px;box-shadow:var(--shadow)}
.hero .logo{background:#fff;border-radius:12px;padding:10px 14px;border:1px solid var(--line);flex:none}
.hero .logo img{display:block;width:200px;height:auto}
.hero-t{display:flex;flex-direction:column;gap:4px;min-width:0}
.hero-t h1{font-size:30px;letter-spacing:-.01em}
.hero .date{font-size:15px;color:var(--muted);font-weight:600}
.hero .who{font-size:15px;color:var(--muted)}
.hero .who b{color:var(--ink)}
.rolechip{display:inline-block;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:13px;border-radius:999px;padding:1px 10px}
.qrstart{display:flex;align-items:center;gap:18px;background:var(--accent);color:var(--accent-ink);border-radius:16px;padding:22px 26px;cursor:pointer;box-shadow:0 6px 18px rgba(11,88,114,.28);min-height:104px}
.qrstart:active{transform:translateY(1px)}
a.qrstart{text-decoration:none;color:var(--accent-ink)}
.qic{width:60px;height:60px;border-radius:14px;background:var(--tag);color:var(--tag-ink);display:grid;place-items:center;flex:none}
.qic svg{width:34px;height:34px}
.qt{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}
.qt b{font-size:24px}
.qt small{font-size:15px;opacity:.85}
.qarrow{font-size:30px;font-weight:700}
.today{display:flex;flex-direction:column;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 20px;text-decoration:none;color:var(--ink);box-shadow:var(--shadow)}
.today .tk{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-weight:700;font-size:17px}
.today .tk b{font-size:26px}
.today .tk b small{font-size:16px;color:var(--faint);font-weight:500}
.today .prog{height:12px}
.menu{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.mtile{position:relative;display:flex;flex-direction:column;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;text-decoration:none;color:var(--ink);box-shadow:var(--shadow);min-height:150px}
.mtile:hover{border-color:var(--accent)}
.mic{width:52px;height:52px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;margin-bottom:6px}
.mic svg{width:28px;height:28px}
.mtile.alert .mic{background:var(--ng-bg);color:var(--ng)}
.mt{font-size:20px;font-weight:700}
.ms{font-size:14px;color:var(--muted)}
.mb{position:absolute;top:16px;right:16px;font-weight:700;font-size:14px;border-radius:999px;padding:3px 11px;color:#fff;background:var(--muted)}
.mb.ng{background:var(--ng)} .mb.todo{background:var(--todo)}
.foot{text-align:center;font-size:13px;color:var(--faint);padding-top:6px}
.pghead{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.pghead h1{font-size:24px}
.manrow{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 0;border-top:1px solid var(--line)}
.manrow:first-of-type{border-top:0}
.mname{font-weight:700;font-size:17px;color:var(--ink);text-decoration:none}
@media (max-width:760px){.menu{grid-template-columns:repeat(2,minmax(0,1fr))}.hero .logo img{width:150px}.qt b{font-size:20px}}

/* ---------- 고장 신고·알림판 ---------- */
.bigbtns{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.qrstart.red{background:var(--ng);box-shadow:0 6px 18px rgba(196,43,43,.25);color:#fff}
a.qrstart.red{color:#fff}
.qrstart.red .qic{background:#fff;color:var(--ng)}
.btnred{background:var(--ng);border-color:var(--ng);color:#fff}
.btnred svg{width:18px;height:18px}
.alertbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 64px);z-index:11;background:var(--ng);color:#fff;display:flex;align-items:center;gap:10px;padding:12px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));font-size:16px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.alertbar[hidden]{display:none}
.alertbar a{color:#fff;text-decoration:none;flex:1;min-width:0}
.alertbar button{border:0;background:rgba(255,255,255,.2);color:#fff;width:40px;height:40px;border-radius:50%;font-size:22px}
.repform{max-width:820px;gap:14px}
.eqpick{display:inline-flex;align-items:center;gap:8px;font-size:18px;background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.repform label.btn svg{width:20px;height:20px}
.sel{border:2px solid var(--line);border-radius:10px;padding:10px 12px;font-size:16px;background:var(--surface);color:var(--ink);min-height:50px;flex:1 1 260px;min-width:0}
.lsel{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.lsb{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:14px;display:flex;flex-direction:column;align-items:flex-start;gap:2px;color:var(--ink);min-height:80px;text-align:left}
.lsb b{font-size:18px}.lsb small{font-size:13px;color:var(--muted)}
.lsb.stop.on{border-color:var(--ng);background:var(--ng-bg)}.lsb.stop.on b{color:var(--ng)}

<body>
<div class="netbar" id="netbar">서버에 연결하지 못했습니다 · 마지막으로 받은 자료를 보여주는 중이며, 저장이 안 될 수 있습니다</div>
<header class="appbar">
  <div class="appbar-in">
    <a class="brand" href="#" title="첫 화면으로"><i aria-hidden="true">QR</i>설비 점검</a>
    <a class="homebtn" id="homeBtn" href="#home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M3 11 12 3l9 8"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg>메인</a>
    <nav class="crumbs" id="crumbs" aria-label="현재 위치"></nav>

      <div class="sesbox" id="sesbox"></div>
      <a class="scanbtn" href="#scan" data-live title="카메라로 QR 스캔">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3M8 12h8"/></svg>
        <span class="t">QR 스캔</span>
      </a>
      <input type="file" id="scanIn" accept="image/*" capture="environment" hidden>
    </div>
  </div>
</header>
<div class="alertbar" id="alertBar" hidden role="alert"></div>
<main class="wrap" id="app">
  <div class="panel"><div class="empty">설비 목록을 불러오는 중입니다…</div></div>
</main>
<div class="toast" id="toast" hidden></div>
<div class="pdfv" id="pdfv" hidden role="dialog" aria-modal="true" aria-label="매뉴얼 보기">
  <div class="pdfbar">
    <div style="min-width:0"><strong id="pdfName"></strong> <span class="muted small" id="pdfInfo"></span></div>
    <div class="row pdfbtns">
      <button class="btn ghost" id="pdfOut" aria-label="축소">－</button>
      <button class="btn ghost" id="pdfIn" aria-label="확대">＋</button>
      <button class="btn ghost" id="pdfDl">내려받기</button>
      <button class="btn primary" id="pdfX">닫기</button>
    </div>
  </div>
  <div class="pdfpages" id="pdfPages"></div>
</div>
<div class="qrv" id="qrv" hidden role="dialog" aria-modal="true" aria-label="QR 스캔">
  <div class="qrv-t">QR을 네모 칸 안에 맞춰 주세요</div>
  <div class="qrv-box"><video id="qrvVid" playsinline muted></video><div class="qrv-frame"></div><div class="qrv-line"></div></div>
  <div class="qrv-s" id="qrvMsg">자동으로 인식됩니다</div>
  <div class="qrv-b"><button class="btn" id="qrvPhoto">코드 입력·사진</button><button class="btn primary" id="qrvX">닫기</button></div>
</div>
<div class="lb-wrap" id="lb" hidden role="dialog" aria-modal="true" aria-label="사진 크게 보기">
  <img id="lbImg" alt="">
  <div class="lb-cap" id="lbCap"></div>
  <button class="lb-x" id="lbX" aria-label="닫기">×</button>
</div>

<script>
const ARTIFACT_URL = location.origin+location.pathname.replace(/index\.html$/,"");   // QR = 이 앱 주소 + #설비코드
const PERIODS = {D:{label:"일상", unit:"일"}, M:{label:"월간", unit:"월"}, Q:{label:"분기", unit:"분기"}, Y:{label:"연간", unit:"년"}};
const PK = ["D","M","Q","Y"];
const manualsOf = e => e?.manuals?.length ? e.manuals : e?.manualId ? [{id:e.manualId,name:e.manualName||"매뉴얼"}] : [];

const ROLES = {PROD:{label:"일상", sub:"매일 하는 점검"}, MAINT:{label:"주기", sub:"월간·분기·연간 점검"}};
// 구분 = 점검 성격: 일상(일일) / 주기(월간·분기·연간). 내부 코드는 기존 데이터 호환을 위해 PROD/MAINT 유지
const PKR = role => role==="MAINT"?["M","Q","Y"]:["D"];
const roleForPeriod = p => p==="D"?"PROD":"MAINT";
function loadRole(){try{const r=localStorage.getItem("eqRole");return ROLES[r]?r:"PROD";}catch(e){return "PROD";}}
function saveRole(r){try{localStorage.setItem("eqRole",r);}catch(e){}}
const S = {role:loadRole(), tabAuto:true, uploading:{}, eq:{}, parts:[], recs:[], db:null, user:null, assets:null, admin:false,
           tab:"D", draft:{}, draftKey:"", names:{}, loaded:{eq:false}, editPart:null, showAll:false,
           issues:[], fix:{}, downloads:null, q:"", exMonth:"",
           life:[], meters:{}, lifeOpen:null, editLife:null,
           points:[], inspector:loadInsp(), scanned:{}, mapEdit:null, editPoint:null, justSaved:null, showDone:false, openFull:false};

const $ = s => document.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2,"0");
function periodKey(p, d = new Date()){
  const y = d.getFullYear(), m = d.getMonth()+1;
  if(p==="D") return `${y}-${pad(m)}-${pad(d.getDate())}`;
  if(p==="M") return `${y}-${pad(m)}`;
  if(p==="Y") return `${y}`;
  return `${y}-Q${Math.floor((m-1)/3)+1}`;
}
function periodText(p,k){
  if(p==="D") return k;
  if(p==="Y") return `${k}년`;
  if(p==="M"){const [y,m]=k.split("-");return `${y}년 ${+m}월`;}
  const [y,q]=k.split("-Q");return `${y}년 ${q}분기`;
}
function fmtTime(ts){const d=new Date(ts);return `${d.getMonth()+1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;}
function toast(msg){const t=$("#toast");t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,2200);}
function route(){return decodeURIComponent(location.hash.replace(/^#/,""));}
const roleOf = x => ROLES[x?.role] ? x.role : "PROD";
function partsOf(code,p,role){return S.parts.filter(x=>x.eq===code && (!p||x.period===p) && (!role||roleOf(x)===role)).sort((a,b)=>(a.order??0)-(b.order??0));}
function recOf(code,p,k,role=S.role){return S.recs.find(r=>r.eq===code&&r.period===p&&r.key===k&&roleOf(r)===role);}
function statusChip(code,p,role){
  const r=recOf(code,p,periodKey(p),role);
  if(!partsOf(code,p,role).length) return `<span class="chip pend">${PERIODS[p].label} 항목없음</span>`;
  if(!recDone(r)) return `<span class="chip pend">${PERIODS[p].label} 미점검</span>`;
  return r.ng>0?`<span class="chip ng">${PERIODS[p].label} 불량 ${r.ng}</span>`:`<span class="chip ok">${PERIODS[p].label} 완료</span>`;
}
function who(r){
  if(r.inspectorName) return esc(r.inspectorName);
  if(r.inspectorId) return esc(S.names[r.inspectorId] || "점검자");
  return esc(r.inspectorLabel || "—");
}
function qrUrl(code){return (ARTIFACT_URL||"(게시 주소)")+"#"+code;}
const num = v => { if(v===""||v==null) return null; const n=parseFloat(String(v).replace(",",".")); return isFinite(n)?n:null; };
function outOfRange(x,v){const n=num(v);if(n==null) return false;const lo=num(x.min),hi=num(x.max);return (lo!=null&&n<lo)||(hi!=null&&n>hi);}
function rangeText(x){const lo=num(x.min),hi=num(x.max);if(lo==null&&hi==null) return "";return lo!=null&&hi!=null?`${lo}~${hi}`:lo!=null?`${lo} 이상`:`${hi} 이하`;}

/* ---------- 교체주기 (사용시간·횟수·일수 기준) ---------- */
const BASIS={hours:{label:"운전시간",unit:"h"},count:{label:"사용 횟수",unit:"회"},days:{label:"경과 일수",unit:"일"}};
const fmtN=n=>n==null||!isFinite(n)?"—":Math.round(n).toLocaleString("ko-KR");
const lifeOf=code=>S.life.filter(l=>l.eq===code);
function lifeState(l){
  const unit=l.basis==="count"?(l.unit||"회"):BASIS[l.basis]?.unit||"";
  let used=null;
  if(l.basis==="hours"){const m=S.meters[l.eq];if(m&&num(m.value)!=null)used=num(m.value)-(num(l.lastValue)||0);}
  else if(l.basis==="count"){if(num(l.current)!=null)used=num(l.current)-(num(l.lastValue)||0);}
  else if(l.basis==="days"){if(l.lastAt)used=(Date.now()-l.lastAt)/864e5;}
  const iv=num(l.interval);
  if(used==null||!iv) return {st:"unknown",unit,used,iv,pct:null,left:null};
  const pct=used/iv, left=iv-used;
  return {st:pct>=1?"over":pct>=0.8?"warn":"ok",unit,used,iv,pct,left};
}
const lifeAlerts=code=>S.life.filter(l=>(!code||l.eq===code)&&["warn","over"].includes(lifeState(l).st));
function renderLife(code){
  const items=lifeOf(code).map(l=>({l,s:lifeState(l)})).sort((a,b)=>(b.s.pct??-1)-(a.s.pct??-1));
  if(!items.length&&!S.admin) return "";
  const m=S.meters[code], hasHours=items.some(x=>x.l.basis==="hours");
  const ord={over:0,warn:1,ok:2,unknown:3};
  return `<section class="panel" aria-label="교체주기 관리">
    <div class="row" style="justify-content:space-between;align-items:flex-end">
      <div><h2>교체주기</h2><div class="hint">80% 넘으면 주황, 주기를 넘으면 빨강으로 표시합니다</div></div>
      ${lifeAlerts(code).length?`<span class="chip ng">교체 임박·초과 ${lifeAlerts(code).length}</span>`:items.length?`<span class="chip ok">이상 없음</span>`:""}
    </div>
    ${hasHours?`<div class="meter">
      <div><span class="muted small">누적 운전시간 (설비 표시창 값)</span><b class="mono">${m?fmtN(m.value)+" h":"미입력"}</b><span class="muted small">${m?`${fmtTime(m.at)} ${esc(m.by||"")} 기록`:"운전시간을 입력해야 시간 기준 항목이 계산됩니다"}</span></div>
      <div class="row"><input class="val mono" id="meterIn" inputmode="numeric" placeholder="현재 운전시간" aria-label="현재 누적 운전시간"><button class="btn primary" id="meterSave">운전시간 갱신</button></div>
    </div>`:""}
    ${!items.length?`<div class="empty">등록된 교체주기 항목이 없습니다. 아래 관리 메뉴에서 추가하세요.</div>`:
    `<div class="lifelist">${items.sort((a,b)=>ord[a.s.st]-ord[b.s.st]||(b.s.pct??0)-(a.s.pct??0)).map(({l,s})=>{
      const open=S.lifeOpen===l.id;
      const pct=s.pct==null?0:Math.min(100,Math.round(s.pct*100));
      return `<div class="life st-${s.st}" data-life="${esc(l.id)}">
        <div class="lhead"><div style="min-width:0"><strong>${esc(l.name)}</strong>${l.example?`<span class="ex">예시</span>`:""}
          <div class="muted small">${BASIS[l.basis]?.label} 기준 · 주기 ${fmtN(s.iv)} ${esc(s.unit)} · 마지막 교체 ${l.lastAt?new Date(l.lastAt).toLocaleDateString("ko-KR"):"—"}${l.basis!=="days"&&l.lastValue!=null?` (${fmtN(l.lastValue)} ${esc(s.unit)})`:""}</div></div>
          <div class="lstate">${s.st==="unknown"?`<span class="muted small">${l.basis==="count"?"현재값 입력 필요":l.basis==="days"?"마지막 교체일 입력 필요":"운전시간 입력 필요"}</span>`:
            `<b class="mono">${Math.round(s.pct*100)}%</b><span>${s.left<0?`${fmtN(-s.left)} ${esc(s.unit)} 초과`:`${fmtN(s.left)} ${esc(s.unit)} 남음`}</span>`}</div></div>
        <div class="bar"><i style="width:${pct}%"></i></div>
        ${l.spare||l.note?`<div class="muted small">${l.spare?`예비품: ${esc(l.spare)}`:""}${l.spare&&l.note?" · ":""}${esc(l.note||"")}</div>`:""}
        <div class="row">
          ${l.basis==="count"?`<button class="btn ghost" data-lact="read">현재 ${esc(s.unit)} 입력</button>`:""}
          <button class="btn ${s.st==="over"||s.st==="warn"?"primary":"ghost"}" data-lact="replace">교체 완료 기록</button>
          ${S.admin?`<button class="btn ghost" data-lact="edit" style="font-size:12px">수정</button>`:""}
        </div>
        ${S.lifeOpen===l.id+":read"?`<div class="lform"><input class="val mono" id="lr_${esc(l.id)}" inputmode="numeric" placeholder="현재 ${esc(s.unit)} (표시창 값)" value="${esc(l.current??"")}"><button class="btn primary" data-lsave="read">저장</button><button class="btn ghost" data-lact="close">취소</button></div>`:""}
        ${S.lifeOpen===l.id+":replace"?`<div class="lform">
          <label>교체일<input type="date" id="lrd_${esc(l.id)}" value="${periodKey("D")}"></label>
          ${l.basis!=="days"?`<label>교체 시점 ${l.basis==="hours"?"운전시간":"값"}<input class="mono" inputmode="numeric" id="lrv_${esc(l.id)}" value="${esc(l.basis==="hours"?(m?.value??""):(l.current??""))}"></label>`:""}
          <label style="flex:1 1 200px">메모<input id="lrn_${esc(l.id)}" placeholder="교체 부품·작업 내용"></label>
          <button class="btn primary" data-lsave="replace">교체 저장</button><button class="btn ghost" data-lact="close">취소</button></div>`:""}
        ${(l.history||[]).length?`<details class="lhist"><summary class="muted small">교체 이력 ${l.history.length}건</summary>${l.history.slice().reverse().map(h=>`<div class="small">${new Date(h.at).toLocaleDateString("ko-KR")} · ${h.value!=null?fmtN(h.value)+" "+esc(s.unit)+" · ":""}${esc(h.by||"")}${h.note?" · "+esc(h.note):""}</div>`).join("")}</details>`:""}
      </div>`;}).join("")}</div>`}
    ${S.admin?renderLifeAdmin(code):""}
  </section>`;
}
function renderLifeAdmin(code){
  const el=S.editLife&&S.life.find(l=>l.id===S.editLife);
  return `<details ${S.editLife?"open":""}><summary class="small" style="font-weight:600">교체주기 항목 ${el?"수정":"추가"} (관리자)</summary>
    <form class="form" id="lifeForm" style="margin-top:8px">
      <label class="full">부품·소모품 이름<input id="lf_name" required value="${esc(el?.name||"")}" placeholder="컷오프 칼날"></label>
      <label>기준<select id="lf_basis">${Object.entries(BASIS).map(([k,v])=>`<option value="${k}" ${(el?.basis||"hours")===k?"selected":""}>${v.label}</option>`).join("")}</select></label>
      <label>교체 주기 (숫자)<input id="lf_iv" inputmode="numeric" required value="${esc(el?.interval??"")}" placeholder="2000"></label>
      <label>단위 (횟수 기준일 때)<input id="lf_unit" value="${esc(el?.unit||"")}" placeholder="회, 회전, 타"></label>
      <label>마지막 교체일<input type="date" id="lf_last" value="${el?.lastAt?new Date(el.lastAt).toISOString().slice(0,10):""}"></label>
      <label>마지막 교체 시점 값<input id="lf_lv" inputmode="numeric" value="${esc(el?.lastValue??"")}" placeholder="교체 당시 운전시간·횟수"></label>
      <label>예비품 정보<input id="lf_spare" value="${esc(el?.spare||"")}" placeholder="품번 / 보유 수량"></label>
      <label class="full">근거·비고<input id="lf_note" value="${esc(el?.note||"")}" placeholder="제조사 매뉴얼 2,000h 교체"></label>

/* ---------- 점검 포인트 ---------- */
const recDone = r => !!r && r.complete!==false;   // 포인트별로 나눠 저장 중인 기록은 complete:false
// 배치도: 보전용 배치도(mapIdMaint)가 있으면 보전 구분에서 그 지도를 씀
const mapKey = e => S.role==="MAINT"&&e?.mapIdMaint?"mapIdMaint":"mapId";
const mapOf = e => e?.[mapKey(e)];
// 포인트 순서: 관리자가 정한 동선 순서(route)가 있으면 그 순서, 없으면 번호 순
const pointsOf = code => S.points.filter(p=>p.eq===code).sort((a,b)=>(a.route??a.no??99)-(b.route??b.no??99)||(a.no??99)-(b.no??99));
const ptLabel = pt => `${pt.no!=null?circled(pt.no)+" ":""}${pt.name}`;
function circled(n){return n>=1&&n<=20?String.fromCharCode(9311+n):`(${n})`;}
// 이 포인트에서 지금(이번 기간) 할 항목: 일상은 오늘, 월간은 이번 달 … 기준
function pointItems(code,ptId,role){
  return S.parts.filter(x=>x.eq===code&&x.point===ptId&&roleOf(x)===role)
    .sort((a,b)=>PK.indexOf(a.period)-PK.indexOf(b.period)||(a.order??0)-(b.order??0))
    .map(x=>{const r=recOf(code,x.period,periodKey(x.period),role);const res=r?.results?.[x.id];return {x,res,done:!!res?.r};});
}
function pointState(code,ptId,role){
  const it=pointItems(code,ptId,role);
  if(!it.length) return {st:"none",left:0,total:0};
  const left=it.filter(i=>!i.done).length, ng=it.filter(i=>i.res?.r==="NG").length;
  return {st:left?"todo":ng?"ng":"done",left,total:it.length,ng};
}

async function savePoint(code,pt,parts){
  collectInputs();

  if(!nm){toast("점검자 이름을 입력해 주세요");$("#inspName")?.focus();return;}
  S.inspector=nm;saveInsp(nm);
  const miss=parts.find(x=>S.draft[x.id]?.r==="NG"&&!S.draft[x.id]?.note);
  if(miss){toast("불량 항목에 내용을 적어주세요: "+miss.name);document.getElementById("n_"+miss.id)?.focus();return;}

  if(nv){toast(`측정값을 입력해 주세요: ${nv.name} (${nv.unit})`);render();document.getElementById("v_"+nv.id)?.focus();return;}
  let uid=null;try{uid=await S.user?.id?.();}catch(e){}
  const btn=$("#ptSave");if(btn)btn.disabled=true;
  const role=S.role, now=Date.now(), via=S.scanned[pt.id]&&now-S.scanned[pt.id]<3600e3?"QR":"선택";
  try{
    for(const p of PK){
      const ps=parts.filter(x=>x.period===p); if(!ps.length) continue;
      const key=periodKey(p), id=`${code}_${role}_${p}_${key}`;
      let cur=null;try{const s=await S.db.doc("records/"+id).get();cur=s.exists?s.data():null;}catch(e){cur=S.recs.find(r=>r.id===id)||null;}
      const results={...(cur?.results||{})};
      for(const x of ps){const d=S.draft[x.id]||{};results[x.id]={r:d.r||"",v:d.v||"",note:d.note||"",photos:d.photos||[],by:nm,at:now,point:pt.id};}
      const all=partsOf(code,p,role);
      const complete=all.every(x=>results[x.id]?.r);
      const ng=all.filter(x=>results[x.id]?.r==="NG").length;
      await S.db.doc("records/"+id).set({eq:code,role,period:p,key,ts:now,ng,results,complete,
        inspectorId:uid||cur?.inspectorId||null,inspectorName:nm,points:{...(cur?.points||{}),[pt.id]:{at:now,by:nm,via}}});
      await syncIssues(code,role,p,key,ps,results,uid,now);
    }
    clearDraft(S.draftKey);S.justSaved=pt.id;S.draftKey="";S.showDone=false;
    const ngN=parts.filter(x=>S.draft[x.id]?.r==="NG").length;
    toast(ngN?`${pt.name} 저장 · 불량 ${ngN}건`:`${pt.name} 점검을 저장했습니다`);
    render();scrollTo(0,document.body.scrollHeight);
  }catch(e){toast(e.code==="not_granted"?"점검 결과를 저장할 권한이 없습니다":"저장하지 못했습니다: "+(e.message||e.code));if(btn)btn.disabled=false;}
}

async function syncIssues(code,role,p,key,parts,results,uid,now){
  for(const x of parts){
    const iid=`${code}_${role}_${p}_${key}_${x.id}`, ex=S.issues.find(i=>i.id===iid), r=results[x.id];
    try{
      if(r?.r==="NG"){
        if(!ex) await S.db.doc("issues/"+iid).set({eq:code,role,period:p,key,partId:x.id,partName:x.name,area:x.area||"",note:r.note,photos:r.photos,ts:now,reporterId:uid||null,reporterLabel:S.inspector||"",status:"open"});
        else if(ex.status==="open") await S.db.doc("issues/"+iid).update({note:r.note,photos:r.photos});
      }else if(ex&&ex.status==="open") await S.db.doc("issues/"+iid).delete();
    }catch(e){}

}

/* ---------- QR 스캔 (사진 한 장 찍어서 읽기) ---------- */
// 사진 한 장에서 QR 찾기: ① 기기 내장 인식기(BarcodeDetector) ② 전체·가운데 잘라 여러 크기로 jsQR
async function decodeQr(bmp){
  if("BarcodeDetector" in window){try{const bd=new BarcodeDetector({formats:["qr_code"]});const r=await bd.detect(bmp);if(r?.[0]?.rawValue) return r[0].rawValue;}catch(e){}}
  if(typeof jsQR==="undefined") return null;
  const W=bmp.width,H=bmp.height,tries=[];
  for(const sz of [1200,1800,800,2600]) tries.push([0,0,W,H,sz]);
  for(const f of [0.6,0.45,0.3,0.2]){const w=W*f,h=H*f;tries.push([(W-w)/2,(H-h)/2,w,h,1400],[(W-w)/2,(H-h)/2,w,h,900]);}
  const c=document.createElement("canvas"),g=c.getContext("2d",{willReadFrequently:true});
  for(const [x,y,w,h,sz] of tries){
    const k=Math.min(2,sz/Math.max(w,h));c.width=Math.round(w*k);c.height=Math.round(h*k);
    g.imageSmoothingEnabled=true;g.drawImage(bmp,x,y,w,h,0,0,c.width,c.height);
    const r=jsQR(g.getImageData(0,0,c.width,c.height).data,c.width,c.height,{inversionAttempts:"attemptBoth"});
    if(r?.data) return r.data;
    await new Promise(res=>setTimeout(res,0));
  }
  return null;
}
async function scanFile(file){
  if(!file) return;
  if(typeof jsQR==="undefined"&&!("BarcodeDetector" in window)){toast("QR 인식 기능을 불러오지 못했습니다. 잠시 후 다시 시도하세요");return;}
  toast("QR 읽는 중…");
  let text=null;
  try{const bmp=await createImageBitmap(file);text=await decodeQr(bmp);}catch(e){}
  if(!text){toast("QR을 찾지 못했습니다. 20~30cm 거리에서 QR이 화면 가운데에 오게, 초점이 맞은 뒤 찍어 주세요");return;}
  handleQr(text);
}
function qrTarget(text){
  const raw=String(text||"").trim();
  let t=raw.includes("#")?raw.slice(raw.lastIndexOf("#")+1):raw;
  try{t=decodeURIComponent(t);}catch(e){}
  t=t.trim();
  const ok=x=>S.eq[x]||S.points.some(p=>p.id===x);
  if(ok(t)) return t;
  const n=t.toUpperCase().replace(/[\s_]+/g,".");   // 'asm04-fm s01' · 'ASM04-FM_S01' 도 허용
  if(ok(n)) return n;
  const n2=n.replace(/\.+/g,"-");                     // 설비코드를 '.'로 친 경우
  return ok(n2)?n2:t;
}
function handleQr(text){
  const target=qrTarget(text);
  if(!S.eq[target]&&!S.points.some(p=>p.id===target)){toast("등록되지 않은 QR입니다: "+target);return;}
  if(S.scanForReport){S.scanForReport=false;S.rep.eq=target.split(".")[0];toast("설비 확인: "+(S.eq[S.rep.eq]?.name||S.rep.eq));render();return;}
  S.scanned[target]=Date.now();S.justSaved=null;
  if(route()===target) render(); else location.hash=target;
  toast("QR 확인: "+(S.points.find(p=>p.id===target)?.name||S.eq[target]?.name||target));
}

async function resolveNames(){
  if(!S.user?.profiles) return;
  const ids=[...new Set([...S.recs.map(r=>r.inspectorId),...S.issues.flatMap(i=>[i.reporterId,i.fixerId])].filter(Boolean))].filter(id=>!(id in S.names));

function render(){
  if(S.ses&&S.ses.day!==periodKey("D")){S.ses=null;try{localStorage.removeItem("eqSession");}catch(e){}}
  syncRole();
  const code=route();
  if(code.includes(".")&&!S.ses&&S.points.some(p=>p.id===code)){renderStart(code);return;}
  if(code.includes(".")){
    const pt=S.points.find(p=>p.id===code), ec=code.split(".")[0];
    if(pt&&S.eq[ec]){renderPoint(ec,pt);return;}
    if(S.loaded.eq&&S.loaded.pts){renderMissing(code);return;}
    $("#app").innerHTML=`<div class="panel"><div class="empty">점검 포인트를 불러오는 중입니다…</div></div>`;return;
  }
  document.body.classList.toggle("landing",!code);
  const hb=$("#homeBtn");if(hb){if(code==="home")hb.setAttribute("aria-current","page");else hb.removeAttribute("aria-current");}
  if(!code){renderLanding();return;}
  if(code==="home"){renderHome();return;}
  if(code==="start"){renderStart(S.ses?"":S.pendTarget);return;}
  if(code==="report"){renderReport();return;}
  if(code==="scan"){renderScan();return;}
  if(code==="bdhist"){renderBdHist();return;}
  const PAGES={list:renderList,inspect:renderList,issues:renderIssuesAll,life:renderLifeAll,history:renderHistoryAll,manuals:renderManuals,admin:renderAdminPage};
  // 점검 화면(설비·포인트·점검 목록)은 '점검 시작'을 한 뒤에만 열림
  const needSes=code==="inspect"||code==="list"||(code&&S.eq[code]&&(S.eqView||"check")==="check");
  if(needSes&&!S.ses){renderStart(code);return;}
  if(PAGES[code]&&!S.eq[code]){PAGES[code]();return;}
  if(code && S.eq[code]) renderEquip(code);
  else if(code && S.loaded.eq) renderMissing(code);
  else renderHome();
}

/* 설비별 오늘 진행 상황 (지금 구분 기준) */
function eqProg(code,role){
  const s=eqState(code,role); if(s.none) return {none:true};
  const pend=s.ps.filter(p=>p!=="D"&&s.st[p]==="todo");
  const dp=partsOf(code,"D",role);
  if(dp.length){
    const r=recOf(code,"D",periodKey("D"),role), res=r?.results||{};
    const done=dp.filter(x=>res[x.id]?.r).length, ng=dp.filter(x=>res[x.id]?.r==="NG").length;
    const st=done===dp.length?(ng?"ng":"ok"):"todo";
    const label=done===dp.length?(ng?`불량 ${ng}`:"오늘 완료"):done?"진행 중":"점검 전";
    return {daily:true,done,total:dp.length,ng,st,label,pend};
  }
  return {daily:false,done:s.ps.length-pend.length,total:s.ps.length,ng:0,st:pend.length?"todo":"ok",label:pend.length?"주기점검 남음":"이번 기간 완료",pend};
}

/* 메인 화면: 구분(생산/보전) 기준 오늘 할 일 → 라인별 설비 */
function eqState(code,role){
  const ps=PK.filter(p=>partsOf(code,p,role).length);
  if(!ps.length) return {none:true};
  const st={};for(const p of ps){const r=recOf(code,p,periodKey(p),role);st[p]=!recDone(r)?"todo":r.ng>0?"ng":"done";}
  return {ps,st};
}

/* ===== 고장 신고 · 고장/불량 알림판 =====
   현장: 사진 + 증상 + 라인 상태 → issues 컬렉션에 kind:"breakdown" 으로 저장
   기술팀: 알림판(#issues)에서 실시간 확인 → 확인 → 조치 중 → 완료
   (텔레그램 알림은 서버 이전 때: notified 표시가 없는 신고를 서버가 보내고 표시) */
const SYMPTOMS=["정지·알람","이상 소음·진동","누유·누기","파손·변형","품질 불량","기타"];
const LINEST={stop:{label:"라인 정지",cls:"ng",sub:"설비가 멈춰 생산 불가"},slow:{label:"감속·부분 운전",cls:"todo",sub:"속도를 낮추거나 일부만 운전"},run:{label:"정상 운전 중",cls:"pend",sub:"운전은 되지만 이상 있음"}};
const STAGE={new:{label:"접수",cls:"ng"},ack:{label:"확인함",cls:"todo"},doing:{label:"조치 중",cls:"todo"},done:{label:"조치 완료",cls:"ok"}};
const isBD=i=>i.kind==="breakdown";
const stageOf=i=>i.status==="closed"?"done":(i.stage||"new");
function ago(ts){const m=Math.max(0,Math.round((Date.now()-ts)/6e4));if(m<1)return "방금";if(m<60)return `${m}분 전`;const h=Math.floor(m/60);if(h<24)return `${h}시간 ${m%60}분 전`;return `${Math.floor(h/24)}일 전`;}
function durTxt(ms){const m=Math.max(0,Math.round(ms/6e4));const h=Math.floor(m/60);return h?`${h}시간 ${m%60}분`:`${m}분`;}
const issueTitle=i=>isBD(i)?(i.symptom||"고장"):(i.partName||"불량");

/* --- 알림 (이 패드에서 켜 둔 경우: 소리 + 화면 위 빨간 띠) --- */
S.alertOn=(()=>{try{return localStorage.getItem("eqAlert")==="1";}catch(e){return false;}})();
S.knownIss=null; S.audio=null;
function unlockAudio(){try{if(!S.audio){const C=window.AudioContext||window.webkitAudioContext;if(C)S.audio=new C();}S.audio?.resume?.();}catch(e){}}
document.addEventListener("pointerdown",()=>{if(S.alertOn)unlockAudio();},{once:true});
function beep(){try{const a=S.audio;if(!a)return;let t=a.currentTime;for(let k=0;k<3;k++){const o=a.createOscillator(),g=a.createGain();o.type="square";o.frequency.value=k%2?660:880;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.25,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.28);o.connect(g).connect(a.destination);o.start(t);o.stop(t+.3);t+=.38;}}catch(e){}}
function checkNewIssues(){
  const ids=new Set(S.issues.map(i=>i.id));
  if(S.knownIss===null){S.knownIss=ids;return;}
  const fresh=S.issues.filter(i=>!S.knownIss.has(i.id)&&i.status==="open"&&Date.now()-i.ts<36e5);
  S.knownIss=ids;
  if(!fresh.length||!S.alertOn) return;
  const i=fresh.sort((a,b)=>(b.lineState==="stop")-(a.lineState==="stop")||b.ts-a.ts)[0], e=S.eq[i.eq];
  const bar=$("#alertBar");
  bar.innerHTML=`<a href="#issues"><b>${isBD(i)?"고장 신고":"점검 불량"}</b> · ${esc(e?eqLabel(e):i.eq)} · ${isBD(i)?`<span class="ls ${i.lineState}">${LINEST[i.lineState]?.label||""}</span> · `:""}${esc(issueTitle(i))}${fresh.length>1?` 외 ${fresh.length-1}건`:""} <u>알림판 보기 →</u></a><button aria-label="알림 닫기" id="alertX">×</button>`;
  bar.hidden=false; $("#alertX").onclick=()=>{bar.hidden=true;};
  beep(); if(i.lineState==="stop") setTimeout(beep,1400);
  const t0=document.title;let n=0;clearInterval(checkNewIssues._t);checkNewIssues._t=setInterval(()=>{document.title=n++%2?t0:"🔴 고장 신고";if(n>12){clearInterval(checkNewIssues._t);document.title=t0;}},1000);
}

/* --- 현장: 고장 신고 화면 (#report) --- */
S.rep={eq:null,line:null,sym:null,note:"",photos:[]};

function eqOptions(sel){
  const groups=[];for(const e of sortedEq()){const k=e.line||"기타";let g=groups.find(x=>x.k===k);if(!g)groups.push(g={k,items:[]});g.items.push(e);}
  return `<option value="">설비를 고르세요</option>`+groups.map(g=>`<optgroup label="${esc(g.k)}">${g.items.map(e=>`<option value="${esc(e.code)}" ${sel===e.code?"selected":""}>${esc(e.name)} (${esc(e.code)})</option>`).join("")}</optgroup>`).join("");
}
function renderReport(){
  setCrumbs(`<span class="sep">/</span><span>고장 신고</span>`);
  if(S.repDone){ // 신고 후: 기술팀 처리 상태를 실시간으로 보여줌
    const i=S.issues.find(x=>x.id===S.repDone), st=i?stageOf(i):"new", e=i&&S.eq[i.eq];
    $("#app").innerHTML=`${pageHead("고장 신고 완료","기술팀 알림판에 바로 올라갔습니다")}
    <section class="panel repdone">
      <div class="bigchk">✓</div>
      <h2>${esc(e?eqLabel(e):"")} · ${esc(i?issueTitle(i):"")}</h2>
      <div class="steps">${["new","ack","doing","done"].map(k=>`<div class="stp ${["new","ack","doing","done"].indexOf(k)<=["new","ack","doing","done"].indexOf(st)?"on":""}"><i></i><span>${STAGE[k].label}</span></div>`).join("")}</div>
      <div class="hint">${st==="new"?"기술팀 확인을 기다리는 중입니다 · 이 화면에서 바로 바뀝니다":st==="ack"?`기술팀 ${esc(i.ackBy||"")}님이 확인했습니다 (${fmtTime(i.ackAt)})`:st==="doing"?`${esc(i.ackBy||"기술팀")}님이 조치 중입니다`:`조치가 끝났습니다: ${esc(i.fixNote||"")}`}</div>
      <div class="row" style="justify-content:center"><a class="btn big" href="#home">메인으로</a><button class="btn big" data-report="">다른 고장 신고</button></div>
    </section>`;

const CAUSES=["기계 마모·파손","전기·센서","공압·유압","조작·설정","이물·청소","소모품 수명","기타"];
const issNav=cur=>`<div class="seg3 navseg"><a href="#issues" aria-current="${cur==="board"?"page":"false"}">알림판 (미조치)</a><a href="#bdhist" aria-current="${cur==="hist"?"page":"false"}">이력·통계</a></div>`;
function bhRange(per){
  const n=new Date(), y=n.getFullYear(), m=n.getMonth();
  if(per==="this") return [new Date(y,m,1).getTime(),Infinity,`${y}년 ${m+1}월`];
  if(per==="last") return [new Date(y,m-1,1).getTime(),new Date(y,m,1).getTime(),`${new Date(y,m-1,1).getFullYear()}년 ${new Date(y,m-1,1).getMonth()+1}월`];
  if(per==="3m") return [Date.now()-90*864e5,Infinity,"최근 3개월"];
  return [0,Infinity,"전체 기간"];
}
function bhFilter(){
  const f=S.bh, [a,b]=bhRange(f.per);
  return S.issues.filter(i=>i.ts>=a&&i.ts<b
    &&(f.kind==="all"||(f.kind==="bd"?isBD(i):!isBD(i)))
    &&(!f.line||(S.eq[i.eq]?.line||"기타")===f.line)
    &&(!f.eq||i.eq===f.eq)
    &&(!f.sym||(isBD(i)?i.symptom:"점검 불량")===f.sym)
    &&(!f.st||(f.st==="open"?i.status==="open":i.status==="closed"))
  ).sort((x,y)=>y.ts-x.ts);
}
const downOf=i=>i.downMs??(isBD(i)&&i.lineState==="stop"&&i.status==="open"?Date.now()-(i.stopStart||i.ts):0);
function barList(rows,unit,fmt=v=>v){
  if(!rows.length) return `<div class="hint">해당 기록 없음</div>`;
  const max=Math.max(...rows.map(r=>r.v),1);
  return `<div class="blist">${rows.map(r=>`<div class="brow" title="${esc(r.k)}: ${esc(fmt(r.v))}${unit}${r.t?" · "+esc(r.t):""}"><span class="bk">${esc(r.k)}</span><span class="bbar"><i style="width:${Math.max(2,Math.round(r.v/max*100))}%"></i></span><span class="bv mono">${esc(fmt(r.v))}${unit}</span>${r.t?`<span class="bt">${esc(r.t)}</span>`:""}</div>`).join("")}</div>`;
}

  </section>`;
  const set=(k,v)=>{f[k]=v;if(k==="line")f.eq="";f.open=null;render();};

async function exportIssues(F,label){
  const q=v=>{const s=String(v??"");return /[",\n]/.test(s)?`"${s.replace(/"/g,'""')}"`:s;};
  const d=ts=>{if(!ts)return "";const x=new Date(ts);return `${x.getFullYear()}-${pad(x.getMonth()+1)}-${pad(x.getDate())} ${pad(x.getHours())}:${pad(x.getMinutes())}`;};
  const rows=[["구분","신고·발견 시각","설비코드","설비명","라인","증상·항목","설명","라인 상태","신고자","확인자","확인 시각","조치 완료 시각","처리 상태","원인","조치 내용","교체 부품","작업 시간(분)","정지 시간(분)","수리 시간(분)","재발 방지","사진 수"]];
  for(const i of F.slice().sort((a,b)=>a.ts-b.ts)){const e=S.eq[i.eq]||{};
    rows.push([isBD(i)?"고장 신고":"점검 불량",d(i.ts),i.eq,e.name||"",e.line||"",issueTitle(i),i.note||"",isBD(i)?(LINEST[i.lineState]?.label||""):"",i.reporterLabel||"",i.ackBy||"",d(i.ackAt),d(i.fixTs),STAGE[stageOf(i)].label,i.cause||"",i.fixNote||"",i.parts||"",i.workMin||"",
      downOf(i)?Math.round(downOf(i)/6e4):"",i.fixTs?Math.round((i.fixTs-i.ts)/6e4):"",i.prevent||"",(i.photos||[]).length]);}
  const csv="﻿"+rows.map(r=>r.map(q).join(",")).join("\r\n");
  if(!F.length){toast("내려받을 기록이 없습니다 · 기간이나 조건을 바꿔 보세요");return;}
  const fn=`고장불량이력_${label.replace(/\s/g,"")}.csv`;
  try{await S.downloads.save({filename:fn,data:csv});toast(`${fn} 저장 · 기기의 '다운로드' 폴더에 있습니다`);}catch(e){if(e?.code==="declined"||e?.code==="cancelled")toast("저장을 취소했습니다");else toast("파일을 만들지 못했습니다");}
}

function ensureDraft(code){
  const k=`${code}|${S.role}|${S.tab}|${periodKey(S.tab)}`;
  if(S.draftKey===k) return;
  S.draftKey=k;
  const r=recOf(code,S.tab,periodKey(S.tab));
  S.draft=r?JSON.parse(JSON.stringify(r.results||{})):{};
  const n=restoreDraft(k);if(n)setTimeout(()=>toast(`저장하지 않은 점검 내용 ${n}개를 불러왔습니다`),50);
}

/* 지난 측정값: 같은 설비·구분·주기의 이전 기간 기록 중 가장 최근 값 */
function lastVal(x){
  const cur=periodKey(x.period);
  const r=S.recs.filter(r=>r.eq===x.eq&&r.period===x.period&&roleOf(r)===roleOf(x)&&r.key!==cur&&r.results?.[x.id]?.v).sort((a,b)=>b.ts-a.ts)[0];
  return r?{v:r.results[x.id].v,ts:r.results[x.id].at||r.ts}:null;
}
const needVal=(x,d)=>!!x.unit&&d?.r&&!(d.v||"").trim();

/* ---------- 매뉴얼 PDF 보기 (앱 안에서 열기) ----------
   새 탭으로 열면 저장소 주소가 앱 밖에서 열리지 않아 'not found'가 나므로,
   앱 안에서 파일을 받아 pdf.js로 쪽마다 그려서 보여줌 (pdf.js는 처음 열 때만 불러옴) */
const PV={doc:null,scale:1,blob:null,name:"",obs:null};
function loadScript(src){return new Promise((ok,no)=>{const s=document.createElement("script");s.src=src;s.onload=ok;s.onerror=()=>no(new Error("PDF 보기 기능을 불러오지 못했습니다"));document.head.appendChild(s);});}
async function ensurePdf(){
  if(window.pdfjsLib&&window.pdfjsWorker) return window.pdfjsLib;
  const B="lib/";
  if(!window.pdfjsLib) await loadScript(B+"pdf.min.js");
  if(!window.pdfjsWorker) await loadScript(B+"pdf.worker.min.js");   // 별도 작업자 없이 화면에서 바로 처리
  return window.pdfjsLib;
}
async function openPdf(id,name){
  $("#pdfv").hidden=false;$("#pdfName").textContent=name;$("#pdfInfo").textContent="불러오는 중…";$("#pdfPages").innerHTML="";
  $("#pdfDl").hidden=!S.downloads;PV.scale=1;
  try{
    const [lib,fd]=await Promise.all([ensurePdf(),EQ.fileData(id)]);
    const buf=fd.bytes.buffer;
    PV.blob=new Blob([buf],{type:"application/pdf"});PV.name=name;
    PV.doc=await lib.getDocument({data:new Uint8Array(buf)}).promise;
    await layoutPdf();
  }catch(e){$("#pdfInfo").textContent="열지 못했습니다: "+(e.message||e);}
}
async function layoutPdf(){
  const doc=PV.doc, box=$("#pdfPages"); if(!doc) return;
  PV.obs?.disconnect(); box.innerHTML="";
  $("#pdfInfo").textContent=`${doc.numPages}쪽 · ${Math.round(PV.scale*100)}%`;
  const w=Math.max(200,box.clientWidth-24)*PV.scale;
  const vp1=(await doc.getPage(1)).getViewport({scale:1});
  for(let i=1;i<=doc.numPages;i++){
    const d=document.createElement("div");d.className="pdfpg";d.dataset.n=i;
    d.style.width=Math.round(w)+"px";d.style.aspectRatio=`${vp1.width}/${vp1.height}`;
    d.innerHTML=`<span class="pgno">${i} / ${doc.numPages}</span>`;box.appendChild(d);
  }
  PV.obs=new IntersectionObserver(es=>es.forEach(en=>{if(en.isIntersecting&&!en.target.dataset.done){en.target.dataset.done="1";renderPg(en.target);}}),{root:box,rootMargin:"800px 0px"});
  box.querySelectorAll(".pdfpg").forEach(d=>PV.obs.observe(d));
}
async function renderPg(d){
  try{
    const pg=await PV.doc.getPage(+d.dataset.n), vp0=pg.getViewport({scale:1});
    d.style.aspectRatio=`${vp0.width}/${vp0.height}`;
    const dpr=Math.min(2,window.devicePixelRatio||1), vp=pg.getViewport({scale:d.clientWidth/vp0.width*dpr});
    const c=document.createElement("canvas");c.width=Math.floor(vp.width);c.height=Math.floor(vp.height);
    await pg.render({canvasContext:c.getContext("2d"),viewport:vp}).promise;d.prepend(c);
  }catch(e){}
}
function zoomPdf(f){
  const box=$("#pdfPages"), rel=box.scrollTop/Math.max(1,box.scrollHeight);
  PV.scale=Math.min(3,Math.max(0.5,PV.scale*f));
  layoutPdf().then(()=>{box.scrollTop=rel*box.scrollHeight;});
}
function closePdf(){$("#pdfv").hidden=true;PV.obs?.disconnect();PV.doc?.destroy?.();PV.doc=null;$("#pdfPages").innerHTML="";}
$("#pdfX").addEventListener("click",closePdf);
$("#pdfIn").addEventListener("click",()=>zoomPdf(1.25));
$("#pdfOut").addEventListener("click",()=>zoomPdf(0.8));
$("#pdfDl").addEventListener("click",async()=>{
  if(!S.downloads||!PV.blob) return;
  try{await S.downloads.save({filename:PV.name.replace(/[\\/:*?"<>|]/g,"_")+".pdf",data:PV.blob});}catch(e){if(e?.code!=="declined")toast("내려받지 못했습니다");}
});
document.addEventListener("click",ev=>{
  const a=ev.target.closest("a[data-pdf]");if(!a) return;
  ev.preventDefault();openPdf(a.dataset.pdf,a.dataset.name||"매뉴얼");

async function shrink(file){
  // 현장 사진은 용량이 크므로 긴 변 1600px JPEG로 줄여서 올림
  try{
    const bmp=await createImageBitmap(file);
    const k=Math.min(1,1600/Math.max(bmp.width,bmp.height));
    const c=document.createElement("canvas");c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);
    c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
    const b=await new Promise(r=>c.toBlob(r,"image/jpeg",0.82));
    return b&&b.size<file.size?b:file;
  }catch(e){return file;}
}

}

/* 판정하던 내용을 이 패드에 임시 저장 → 앱이 꺼져도 다시 열면 이어서 */
const DKEY=k=>"eqDraft|"+k;
function persistDraft(){if(!S.draftKey)return;try{const has=Object.values(S.draft).some(d=>d&&(d.r||d.v||d.note||(d.photos||[]).length));if(has)localStorage.setItem(DKEY(S.draftKey),JSON.stringify({at:Date.now(),d:S.draft}));}catch(e){}}
function restoreDraft(k){try{const o=JSON.parse(localStorage.getItem(DKEY(k))||"null");if(!o||Date.now()-o.at>36*3600e3)return false;
  let n=0;for(const [id,d] of Object.entries(o.d||{})){if(d&&(d.r||d.v||d.note||(d.photos||[]).length)){S.draft[id]={...(S.draft[id]||{}),...d};n++;}}return n;}catch(e){return false;}}
function clearDraft(k){try{localStorage.removeItem(DKEY(k));}catch(e){}}
document.addEventListener("input",ev=>{if(ev.target.closest(".item")){collectInputs();clearTimeout(persistDraft._t);persistDraft._t=setTimeout(persistDraft,400);}});
function collectInputs(){
  document.querySelectorAll("[data-fixnote]").forEach(i=>{(S.fix[i.dataset.fixnote]||(S.fix[i.dataset.fixnote]={})).note=i.value.trim();});
  for(const [k,a] of [["cause","fixcause"],["parts","fixpart"],["workMin","fixmin"],["prevent","fixprev"],["life","fixlife"]])
    document.querySelectorAll(`[data-${a}]`).forEach(i=>{(S.fix[i.dataset[a]]||(S.fix[i.dataset[a]]={}))[k]=i.value.trim();});
  document.querySelectorAll(".item").forEach(it=>{
    const id=it.dataset.part, d=S.draft[id]||(S.draft[id]={});
    const v=document.getElementById("v_"+id), n=document.getElementById("n_"+id);
    if(v) d.v=v.value.trim(); if(n) d.note=n.value.trim();
  });
}

async function saveRecord(code){
  collectInputs();
  const p=S.tab,key=periodKey(p),parts=partsOf(code,p,S.role);
  const results={};for(const x of parts){const d=S.draft[x.id]||{};results[x.id]={r:d.r||"",v:d.v||"",note:d.note||"",photos:d.photos||[]};}
  const ng=Object.values(results).filter(v=>v.r==="NG").length;
  const missingNote=parts.filter(x=>results[x.id].r==="NG"&&!results[x.id].note);
  if(missingNote.length){toast("불량 항목에 내용을 적어주세요: "+missingNote[0].name);document.getElementById("n_"+missingNote[0].id)?.focus();return;}
  const nv=parts.find(x=>needVal(x,S.draft[x.id]));
  if(nv){toast(`측정값을 입력해 주세요: ${nv.name} (${nv.unit})`);render();document.getElementById("v_"+nv.id)?.focus();return;}
  let uid=null;try{uid=await S.user?.id?.();}catch(e){}
  const btn=$("#saveBtn");if(btn)btn.disabled=true;
  try{
    const now=Date.now();
    await S.db.doc(`records/${code}_${S.role}_${p}_${key}`).set({eq:code,role:S.role,period:p,key,ts:now,ng,results,complete:true,inspectorId:uid||null,inspectorName:S.inspector||""});
    // 불량 항목은 '불량 조치' 목록으로 넘기고, 다시 양호로 바뀐 항목은 미조치 목록에서 뺌
    for(const x of parts){
      const iid=`${code}_${S.role}_${p}_${key}_${x.id}`, ex=S.issues.find(i=>i.id===iid), r=results[x.id];
      try{
        if(r.r==="NG"){
          if(!ex) await S.db.doc("issues/"+iid).set({eq:code,role:S.role,period:p,key,partId:x.id,partName:x.name,area:x.area||"",note:r.note,photos:r.photos,ts:now,reporterId:uid||null,status:"open"});
          else if(ex.status==="open") await S.db.doc("issues/"+iid).update({note:r.note,photos:r.photos});
        }else if(ex&&ex.status==="open") await S.db.doc("issues/"+iid).delete();
      }catch(e){}
    }
    clearDraft(S.draftKey);S.draftKey="";toast(ng?`저장했습니다 · 불량 ${ng}건`:"점검 완료를 저장했습니다");
  }catch(e){toast(e.code==="not_granted"?"점검 결과를 저장할 권한이 없습니다":"저장하지 못했습니다: "+(e.message||e.code));if(btn)btn.disabled=false;}
}

async function exportMonth(){

  const btn=$("#exBtn"); if(btn){btn.disabled=true;btn.textContent="만드는 중…";}
  try{
    const snap=await S.db.collection("records").where("ts",">=",start).where("ts","<",end).get();
    const recs=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>a.ts-b.ts);
    if(!recs.length){toast(`${y}년 ${mo}월 점검 기록이 없습니다`);return;}
    S.recs.push(...recs.filter(r=>!S.recs.some(x=>x.id===r.id)));await resolveNames();
    const q=v=>{const s=String(v??"");return /[",\n]/.test(s)?`"${s.replace(/"/g,'""')}"`:s;};
    const head=["점검일","저장시각","설비코드","설비명","위치","구분","주기","대상기간","점검부위","점검항목","판정기준","측정값","단위","판정","비고","사진수","점검자","조치상태","조치내용"];
    const rows=[head];
    for(const r of recs){
      const e=S.eq[r.eq]||{}, d=new Date(r.ts);
      for(const [pid,v] of Object.entries(r.results||{})){
        const x=S.parts.find(p=>p.id===pid)||{name:pid};
        const iss=S.issues.find(i=>i.id===`${r.eq}_${roleOf(r)}_${r.period}_${r.key}_${pid}`)||S.issues.find(i=>i.eq===r.eq&&i.partId===pid&&i.key===r.key&&i.period===r.period);
        rows.push([`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`,`${pad(d.getHours())}:${pad(d.getMinutes())}`,r.eq,e.name||"",e.location||"",
          ROLES[roleOf(r)].label,PERIODS[r.period]?.label||r.period,periodText(r.period,r.key),x.area||"",x.name,x.criterion||"",v.v||"",x.unit||"",
          v.r==="OK"?"양호":v.r==="NG"?"불량":"",v.note||"",(v.photos||[]).length,v.by||r.inspectorName?(v.by||r.inspectorName):r.inspectorId?(S.names[r.inspectorId]||"점검자"):(r.inspectorLabel||""),
          v.r==="NG"?(iss?.status==="closed"?"조치완료":"미조치"):"",iss?.fixNote||""]);
      }
    }
    const csv="﻿"+rows.map(r=>r.map(q).join(",")).join("\r\n");
    await S.downloads.save({filename:`설비점검일지_${y}-${pad(mo)}.csv`,data:csv});
    toast(`설비점검일지_${y}-${pad(mo)}.csv 저장 · 기기의 '다운로드' 폴더에 있습니다`);
  }catch(e){if(e?.code!=="declined"&&e?.code!=="cancelled")toast("파일을 만들지 못했습니다: "+(e.message||e.code));}
  finally{const b=$("#exBtn");if(b){b.disabled=false;b.textContent="CSV 내려받기";}}
}

/* ---------- QR 스캔 화면 (스페어파트 앱과 같은 방식) ----------
   claude.ai 안에서는 앱이 카메라 실시간 화면을 쓸 수 없으므로
   ① 핸드폰 기본 QR 스캐너로 라벨 링크 열기 ② 코드 붙여넣기·USB 스캐너·직접 입력 ③ 사진으로 읽기 */
function renderScan(){
  setCrumbs(`<span class="sep">/</span><span>QR 스캔</span>`);
  $("#app").innerHTML=`${pageHead("QR 스캔","라벨 QR을 읽거나 코드를 넣으면 해당 설비·포인트 점검 화면이 열립니다")}
  ${LIVE_SCAN?`<button class="qrstart" id="liveGo" style="border:0;text-align:left;font:inherit">
    <span class="qic">${MI.qr}</span><span class="qt"><b>카메라로 스캔</b><small>QR을 네모 칸에 비추면 바로 열립니다${S.noLive?" · 앞서 카메라를 열지 못했습니다. 주소창의 카메라 권한을 확인하세요":""}</small></span><span class="qarrow">→</span></button>`:""}
  <section class="panel scanway">
    <div class="stepl"><span class="stepn">1</span>코드 넣기 · 붙여넣기 · 바코드 스캐너</div>
    <div class="codebox" id="codeBox"><input id="codeIn" class="bigin" placeholder="ASM04-FM.S01" autocomplete="off" autocapitalize="characters" spellcheck="false" enterkeyhint="go"><button class="btn primary big" id="codeGo">열기</button></div>
    <div class="hint">QR 스캐너로 읽은 링크·텍스트를 복사해 붙여넣으면 바로 열립니다. PC에 USB QR 스캐너가 있으면 이 칸에 커서를 두고 찍으세요. 라벨 오른쪽 위의 코드(예: ASM04-FM · 1번 → ASM04-FM.S01)를 직접 쳐도 됩니다.</div>
  </section>
  <section class="panel scanway">
    <div class="stepl"><span class="stepn">2</span>핸드폰 기본 QR 스캐너</div>
    <ol class="hint">
      <li><b>갤럭시</b>: 빠른 설정의 <b>'QR 코드 스캔'</b> 또는 기본 카메라로 라벨을 비춤 → 뜨는 링크를 누르면 점검 화면이 바로 열림</li>
      <li><b>아이폰</b>: 기본 카메라로 라벨을 비추고 노란 링크를 누름</li>
      <li>링크 대신 텍스트만 보이면 <b>복사</b>해서 위 1번 칸에 붙여넣기</li>
    </ol>
  </section>
  <section class="panel scanway">
    <div class="stepl"><span class="stepn">3</span>사진 찍어서 읽기</div>
    <label class="btn big">${ICON.cam} 라벨 사진 찍기<input type="file" id="scanPh" accept="image/*" capture="environment" hidden></label>
    <div class="hint">QR이 화면 가운데 크게 오도록 20~30cm 거리에서, 초점이 맞은 뒤 찍으세요.</div>
  </section>`;
  $("#liveGo")?.addEventListener("click",()=>{S.noLive=false;liveScan($("#scanIn"),false);});
  const inp=$("#codeIn"),box=$("#codeBox");
  const go=()=>{const v=inp.value.trim();if(!v){inp.focus();return;}inp.value="";handleQr(v);};
  $("#codeGo").onclick=go;
  inp.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();go();}});
  inp.addEventListener("paste",()=>setTimeout(go,0));
  inp.addEventListener("focus",()=>box.classList.add("focused"));
  inp.addEventListener("blur",()=>box.classList.remove("focused"));
  $("#scanPh").addEventListener("change",ev=>{const f=ev.target.files[0];ev.target.value="";scanFile(f);});
  if(matchMedia("(pointer: fine)").matches) inp.focus();   // PC: USB 스캐너가 바로 입력되게
}
// USB QR/바코드 스캐너: 입력칸이 아닌 곳에서 빠르게 들어온 글자 + Enter 를 QR로 처리 (어느 화면에서나)
const KB={buf:"",t:0};
document.addEventListener("keydown",ev=>{
  const tg=ev.target;if(tg?.closest?.("input,textarea,select,[contenteditable]")) return;
  const now=performance.now();if(now-KB.t>80)KB.buf="";KB.t=now;
  if(ev.key==="Enter"){if(KB.buf.length>=6){const v=KB.buf;KB.buf="";ev.preventDefault();handleQr(v);}return;}
  if(ev.key.length===1)KB.buf+=ev.key;
});

/* ---------- 시작 ---------- */
window.addEventListener("hashchange",()=>{S.eqView=S.pendView||"check";S.pendView=null;S.mapEdit=null;S.draftKey="";S.editPart=null;S.showAll=false;S.tab="D";S.tabAuto=true;S.justSaved=null;S.showDone=false;render();scrollTo(0,0);});
// 패드 기본 카메라로 QR을 찍어 링크로 들어온 경우도 '현장 QR 확인'으로 봄
if(route()) S.scanned[route()]=Date.now();
/* 실시간 QR 스캔: 카메라 화면을 띄워 자동 인식. 카메라를 못 쓰는 환경이면 기존 '사진 찍기'로 자동 전환 */
const QV={stream:null,raf:0,input:null,forReport:false};
function qvStop(){cancelAnimationFrame(QV.raf);QV.raf=0;if(QV.stream){QV.stream.getTracks().forEach(t=>t.stop());QV.stream=null;}const v=$("#qrvVid");if(v)v.srcObject=null;$("#qrv").hidden=true;}
async function liveScan(input,forReport){
  QV.input=input;QV.forReport=forReport;
  const fallback=()=>{if(forReport)input?.click();else location.hash="scan";};
  if(S.noLive||!navigator.mediaDevices?.getUserMedia||typeof jsQR==="undefined"){fallback();return;}
  try{
    QV.stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"},width:{ideal:1280},height:{ideal:720}},audio:false});
  }catch(e){
    S.noLive=true;
    toast(e&&e.name==="NotAllowedError"?"카메라 사용이 허용되지 않았습니다 · 주소창의 카메라 권한을 허용해 주세요":"카메라를 열지 못했습니다 · 코드 입력이나 사진으로 읽어 주세요");
    fallback();return;
  }
  const v=$("#qrvVid");v.srcObject=QV.stream;$("#qrv").hidden=false;$("#qrvMsg").textContent="자동으로 인식됩니다";
  try{await v.play();}catch(e){}
  const c=document.createElement("canvas"),g=c.getContext("2d",{willReadFrequently:true});let last=0;
  const tick=t=>{
    QV.raf=requestAnimationFrame(tick);
    if(t-last<140||v.readyState<2||!v.videoWidth) return; last=t;
    const k=Math.min(1,720/Math.max(v.videoWidth,v.videoHeight));c.width=Math.round(v.videoWidth*k);c.height=Math.round(v.videoHeight*k);
    g.drawImage(v,0,0,c.width,c.height);
    const r=jsQR(g.getImageData(0,0,c.width,c.height).data,c.width,c.height,{inversionAttempts:"dontInvert"});
    if(r?.data){qvStop();navigator.vibrate?.(80);if(QV.forReport){S.repKeep?.();S.scanForReport=true;}handleQr(r.data);}
  };
  QV.raf=requestAnimationFrame(tick);
}
$("#qrvX").onclick=qvStop;
$("#qrvPhoto").onclick=()=>{const i=QV.input,f=QV.forReport;qvStop();if(f){S.repKeep?.();i?.click();}else location.hash="scan";};
document.addEventListener("keydown",ev=>{if(ev.key==="Escape"&&!$("#qrv").hidden)qvStop();});
document.addEventListener("visibilitychange",()=>{if(document.hidden&&QV.stream)qvStop();});
window.addEventListener("hashchange",()=>{if(QV.stream)qvStop();});
// QR 찍기 버튼(상단·점검 목록·고장 신고)을 누르면 실시간 스캔 먼저 시도
const LIVE_SCAN=true;    // 깃허브 페이지·NAS 처럼 앱이 직접 열리는 곳에서는 실시간 카메라 사용 가능
if(LIVE_SCAN) document.addEventListener("click",ev=>{
  const a=ev.target.closest("a[data-live]");
  if(a&&!S.noLive){ev.preventDefault();liveScan($("#scanIn"),false);return;}
  if(a) return;
  const lab=ev.target.closest("label");if(!lab) return;
  const inp=lab.querySelector("#scanIn,#scanList,#repScan");if(!inp||ev.target===inp) return;
  ev.preventDefault();liveScan(inp,inp.id==="repScan");
},true);
$("#scanIn").addEventListener("change",ev=>{const f=ev.target.files[0];ev.target.value="";scanFile(f);});
render();
(async()=>{
  const c=window.claude;
  if(!c?.use){S.loaded.eq=true;render();return;}
  const [db,user,assets,downloads]=await Promise.all([c.use("db"),c.use("user"),c.use("assets"),c.use("downloads")]);
  S.db=db;S.user=user;S.assets=assets;S.downloads=downloads;
  try{S.admin=user?await user.canEdit():false;}catch(e){}
  if(!db){S.loaded.eq=true;render();return;}
  db.collection("equipment").onSnapshot(s=>{S.eq={};s.docs.forEach(d=>S.eq[d.id]={code:d.id,...d.data()});S.loaded.eq=true;render();},()=>{S.loaded.eq=true;render();});
  db.collection("parts").onSnapshot(s=>{S.parts=s.docs.map(d=>({id:d.id,...d.data()}));render();});
  db.collection("life").onSnapshot(s=>{S.life=s.docs.map(d=>({id:d.id,...d.data()}));render();});
  db.collection("meters").onSnapshot(s=>{S.meters={};s.docs.forEach(d=>S.meters[d.id]=d.data());render();});
  db.collection("points").onSnapshot(s=>{S.points=s.docs.map(d=>({id:d.id,...d.data()}));S.loaded.pts=true;render();},()=>{S.loaded.pts=true;render();});
  db.collection("issues").onSnapshot(s=>{S.issues=s.docs.map(d=>({id:d.id,...d.data()}));checkNewIssues();render();resolveNames();});
  db.collection("records").orderBy("ts","desc").limit(500).onSnapshot(s=>{S.recs=s.docs.map(d=>({id:d.id,...d.data()}));if(!Object.values(S.draft).some(v=>v&&(v.r||v.photos?.length)))S.draftKey="";render();resolveNames();});
})();
</script>
